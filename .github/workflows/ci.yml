name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 gpg gpg-agent gpgconf sqv
          sudo apt-get install -y --reinstall dpkg
          dpkg-query -W dpkg
          for f in /usr/share/dpkg/cputable /usr/share/dpkg/tupletable /usr/share/dpkg/triplettable /usr/share/dpkg/ostable /usr/share/dpkg/abitable; do
            if [ -e "$f" ]; then
              stat -c '%n uid=%u gid=%g mode=%a ftype=%F' "$f"
            else
              echo "$f absent"
            fi
          done
          bwrap --help | grep -F -- '--bind-fd'
          std=$(/usr/bin/python3 -I -S -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')
          echo "python stdlib $std"
          find "$std" -type l -printf '%p -> %l\n'
          for p in /etc/resolv.conf /run /run/systemd /run/systemd/resolve /run/systemd/resolve/stub-resolv.conf /run/systemd/resolve/resolv.conf; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              stat -c '%n uid=%u gid=%g mode=%a type=%F' "$p"
              if [ -L "$p" ]; then readlink "$p"; fi
            else
              echo "$p absent"
            fi
          done
          getent passwd systemd-resolve || echo "systemd-resolve absent"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p fujiang-plugin-agent --all-targets --no-deps -- -D warnings
      - name: Test agent
        run: |
          set +e
          log="${RUNNER_TEMP}/agent-test.log"
          cargo test -p fujiang-plugin-agent >"$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            python3 - "$log" << 'PY' || true
          import sys
          text = open(sys.argv[1], errors="replace").read()
          failed, blocks, buf, grab = [], [], [], False
          for line in text.splitlines():
              if line.startswith("test ") and line.endswith(" ... FAILED"):
                  name = line[5:-11].strip()
                  if name and name not in failed:
                      failed.append(name)
              hit = "panicked at" in line or ("assertion" in line and "failed" in line)
              if hit:
                  if grab and buf:
                      blocks.append("\n".join(buf)[:700])
                  grab, buf = True, [line]
              elif grab:
                  if line.startswith("failures:") or line.startswith("test result:"):
                      blocks.append("\n".join(buf)[:700])
                      grab, buf = False, []
                  else:
                      buf.append(line)
          if grab and buf:
              blocks.append("\n".join(buf)[:700])
          body = "failed: " + ", ".join(failed[:40])
          if blocks:
              body += "\n" + "\n---\n".join(blocks[:8])
          body = body[:4000]
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Agent regression::" + esc(body))
          PY
          fi
          exit "$status"
      - name: Test fujiang
        run: cargo test -p fujiang
      - name: Agent file length
        run: scripts/check-file-length.sh
      - name: Install llvm-cov
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Coverage summary
        continue-on-error: true
        run: cargo llvm-cov -p fujiang-plugin-agent --summary-only
