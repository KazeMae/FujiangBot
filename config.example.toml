[adapter]
# napcat_ws | llonebot_ws | llonebot_http
backend = "napcat_ws"
access_token = ""
ws_url = "ws://127.0.0.1:3001"
# llonebot_http 时使用：
http_api = "http://127.0.0.1:3000"
event_listen = "127.0.0.1:5700"

# 兼容旧配置；未写 [adapter].ws_url / access_token 时回退到这里
[napcat]
ws_url = "ws://127.0.0.1:3001"
access_token = ""

[bot]
command_prefix = "."
groups = [741798363, 749764026, 827689130, 187695029, 555973858, 956907657]
allow_private = true

[store]
db = "data/fujiang.db"
image_root = "data/images"
archive_dir = "data/archive"
archive_after_days = 30
archive_every_hours = 24

[clist]
username = ""
api_key = ""
limit = 10

[plugins]
dir = "plugins"
watch = true
disabled = []

[plugins.contest]
enabled = true
update_minutes = 60

[plugins.rank]
enabled = true
update_minutes = 60

[plugins.problem]
enabled = true
daily_reset_hour = 4

[plugins.fun]
enabled = true
allow_mutate = true
admins = []
delete_files_on_album_del = false

[plugins.luck]
enabled = true

# 动态插件各自一份 JSON，例如：
# [plugins.configs.echo]
# prefix = "."
#
# [plugins.configs.memo]
# max_per_source = 50
# ttl_days = 0
#
# 所有插件（含内置）都认这些宿主字段，写在 configs 里即可：
# [plugins.configs.luck]
# groups = [741798363]   # 空或不写 = 所有生效群
# allow_private = true
# priority = 0           # 越大越先处理；命令主人仍最先
# inject = ["rank"]      # 等这些服务 ready 再 on_start
# provides = ["luck"]    # 声明会 ctx.provide 的名字（给环检测用）
#
# 同一插件多实例（id 必须唯一，不能等于内置名）。默认实例 id = 插件名。
# [[plugins.instances]]
# id = "rank-fresh"
# plugin = "rank"
# [plugins.configs.rank-fresh]
# groups = [555973858]
# share_data = true      # 额外实例默认独立 sqlite；true 则和默认实例共用

# 对话插件编进 fujiang 本体。不要把 libfujiang_plugin_agent.so 放进 plugins/。
# 密钥放进程环境变量，不要写进这个文件。说明见 docs/agent.md。
# [plugins.configs.agent]
# priority = 10
# base_url = "https://api.deepseek.com"
# model = "deepseek-flash"
# # 只走 Responses：POST {base_url}/responses；旧字段 api 若存在会被忽略
# api_key_env = "FUJIANG_LLM_KEY"
# temperature = 0.7
# max_history_turns = 20
# timeout_secs = 60
# vision_enabled = false
# max_image_bytes = 5242880
# # 默认不看图。改成 true 之后，当前消息里的图片才会取字节，并放进 Responses 的 input_image。
# # 单张超过 max_image_bytes 就回复一句中文，不调用模型。写成 0 时仍是 5242880。
# max_tool_rounds = 3
# enable_rank_tools = true
# enable_contest_tools = true
# enable_problem_tools = true
# enable_memo_tools = true
# enable_memo_write_tools = false
# enable_fun_tools = true
# inject_tool_list = false
# # rank、contest、problem、memo、fun 的读工具默认都开。写成 false 就从请求里拿掉对应的内置工具。
# # enable_memo_write_tools 默认 false。改成 true 之后才带 memo_add。enable_memo_tools 为 false 时，memo_add 也不带。
# # fun 没有写工具开关。enable_fun_tools 为 false 时，fun_tags、fun_stars、fun_learn、fun_search 都不带。
# # inject_tool_list 默认 false。改成 true 后，当前启用工具的短清单会追加到系统提示。`.agent tools` 始终列出同一份清单。
# # 工具名写成「服务.方法」。请求里的函数名把点换成下划线。
# # 内置工具默认已有 rank.list、rank.get、contest.upcoming、contest.today、problem.today、memo.list、fun.tags、fun.stars、fun.learn、fun.search。
# # memo.add 要等 enable_memo_write_tools = true。memo 插件以 .so 加载后才提供 memo 服务。
# # fun 随 fujiang 启动。这次不注册删除图库、改学话、改收藏、改 tag 的工具。
# # 下面这项和已启用的 rank_list 函数名相同，所以不会发出去。关掉 enable_rank_tools 之后才会。
# [[plugins.configs.agent.tools]]
# name = "rank.list"
# description = "列出当前榜"
# parameters = { type = "object", properties = {} }
# system_prompt = "你是福酱，西南科技大学 ACM 群助手。"
# wake_words = ["福酱"]
# require_at = false
# blacklist = ["代写"]
# 命中后回复固定中文，不调用模型，不计数。admins 里的 QQ 也拦。
# admins = [10001]
# 这些 QQ 不计入每小时次数。空数组表示没有人免去次数。黑名单仍然生效。
# [plugins.configs.agent.rate_limit]
# per_user_per_hour = 30
# per_group_per_hour = 120
# [plugins.configs.agent.personas.strict]
# system_prompt = "只回答竞赛相关的问题。不确定就说不知道。"

# 内嵌配置页，不要和 adapter.event_listen 抢端口
[admin]
listen = "127.0.0.1:8787"
# 非空则改配置要带请求头 X-Admin-Token；页面会提示输入
token = ""
