[adapter]
# napcat_ws | llonebot_ws | llonebot_http
backend = "napcat_ws"
access_token = ""
ws_url = "ws://127.0.0.1:3001"
# llonebot_http 时使用：
http_api = "http://127.0.0.1:3000"
event_listen = "127.0.0.1:5700"

# 兼容旧配置；未写 [adapter].ws_url / access_token 时回退到这里
[napcat]
ws_url = "ws://127.0.0.1:3001"
access_token = ""

[bot]
command_prefix = "."
groups = [741798363, 749764026, 827689130, 187695029, 555973858, 956907657]
allow_private = true

[store]
db = "data/fujiang.db"
image_root = "data/images"
archive_dir = "data/archive"
archive_after_days = 30
archive_every_hours = 24

[clist]
username = ""
api_key = ""
limit = 10

[plugins.contest]
enabled = true
update_minutes = 60

[plugins.rank]
enabled = true
update_minutes = 60

[plugins.problem]
enabled = true
daily_reset_hour = 4

[plugins.fun]
enabled = true
allow_mutate = true
admins = []
delete_files_on_album_del = false

[plugins.luck]
enabled = true

# 内嵌配置页，不要和 adapter.event_listen 抢端口
[admin]
listen = "127.0.0.1:8787"
# 非空则改配置要带请求头 X-Admin-Token；页面会提示输入
token = ""
